global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: "printers_snmp"
    scrape_interval: 120s
    scrape_timeout: 30s
    metrics_path: /snmp
    
    file_sd_configs:
      - files:
          - /usr/local/etc/prometheus/file_sd/printers.yml

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - snmp_module
        target_label: __param_module

      - source_labels:
          - snmp_auth
        target_label: __param_auth

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: 127.0.0.1:9116
  
  - job_name: "xerox_billing"
    scrape_interval: 120s
    scrape_timeout: 30s
    metrics_path: /snmp

    static_configs:
      - targets:
          - 192.168.0.208
        labels:
          device_name: "XEROX_C405_ADMINISTRACAO"
          vendor: "Xerox"
          location: "Administracao"

      - targets:
          - 192.168.0.210
        labels:
          device_name: "XEROX_C405_SECRETARIA"
          vendor: "Xerox"
          location: "Secretaria"

      - targets:
          - 192.168.0.211
        labels:
          device_name: "XEROX_C8055_CENTRALCOPIAS"
          vendor: "Xerox"
          location: "CentralCopias"

      - targets:
          - 192.168.0.217
        labels:
          device_name: "XEROX_C8170_CENTRALCOPIAS"
          vendor: "Xerox"
          location: "CentralCopias"

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      - target_label: __param_module
        replacement: xerox_billing

      - target_label: __param_auth
        replacement: ftorino_v2

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: 127.0.0.1:9116
